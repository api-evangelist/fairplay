aid: fairplay
name: Fairplay
description: >-
  Fairplay is a Mexican fintech offering flexible, collateral-free business
  financing for e-commerce sellers, marketplaces, retailers, and wholesalers.
  Its products include revolving credit lines (MXN 2-30 million), invoice
  advances/factoring, and working-capital financing, underwritten from a
  company's sales and analytics data with offers issued in as little as 48 hours
  through a 100% digital process. Fairplay operates as a Sociedad Financiera de
  Objeto Multiple, Entidad No Regulada (SOFOM E.N.R.) under Mexican CNBV and
  CONDUSEF supervision and is ISO/IEC 27001:2022 certified for information
  security. The company was surfaced as a portfolio company of QED Investors and
  Speedinvest. Fairplay serves financing and account data to customers through a
  private insights dashboard; no public developer API is currently published.
